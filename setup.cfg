[metadata]
name = vscode-hpc
version = 0.1.0
description = Open VS Code on a Slurm compute node through SSH
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
url = https://github.com/micknudsen/vscode-hpc

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    vscode-hpc = vscode_hpc.cli:main
